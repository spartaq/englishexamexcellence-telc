<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#darkGradient)"/>
  
  <!-- Book/Scroll Icon -->
  <g transform="translate(256, 256) scale(0.8)">
    <!-- Book spine/center bar -->
    <rect x="-40" y="-80" width="80" height="160" rx="4" fill="#ffffff" opacity="0.1"/>
    
    <!-- Open book pages -->
    <path d="M-60,-60 L-60,60 L20,60 L20,-40 L100,-40 L100,60 L200,60 L200,-60 Z" fill="url(#redGradient)"/>
    
    <!-- Page content lines -->
    <rect x="30" y="0" width="80" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="20" width="60" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="40" width="70" height="6" rx="2" fill="#ffffff" opacity="0.9"/>
    
    <!-- Language/English elements -->
    <circle cx="140" cy="0" r="8" fill="url(#darkGradient)" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <path d="M135,0 L137,3 L132,2 L137,-1 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Emphasis/Hierarchy lines -->
    <line x1="30" y1="60" x2="110" y2="60" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="30" y1="70" x2="90" y2="70" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
  
  <!-- TELC text mark (minimal, elegant) -->
  <text x="256" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#ffffff" opacity="0.7">TELC</text>
</svg>